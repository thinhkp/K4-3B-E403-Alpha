services:
  mongodb:
    image: mongo:8
    container_name: vlearn-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vlearn
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: vlearn-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
